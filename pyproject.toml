[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "toolkit"
version = "1.0.0"
description = "Calculator and unit converter"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Katia" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["scr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
